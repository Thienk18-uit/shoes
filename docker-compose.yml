version: '3.9'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      - db
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - DB_HOST=db
      - DB_USER=shoestore
      - DB_PASS=shoestorepass
      - DB_NAME=shoestore

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shoestore
      MYSQL_USER: shoestore
      MYSQL_PASSWORD: shoestorepass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./shoestore.sql:/docker-entrypoint-initdb.d/shoestore.sql:ro

volumes:
  db_data:
